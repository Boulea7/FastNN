name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # CPU-only build plus the full finite-difference gradient-check suite.
  # GitHub runners have no CUDA toolkit, so this exercises the CPU maths; the
  # kernels are checked against it locally by tests/cuda_parity.rs.
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build (CPU-only)
        run: cargo build --no-default-features --all-targets

      - name: Gradient checks (finite difference)
        run: cargo test --no-default-features --test gradcheck -- --nocapture

      - name: Unit + integration tests
        run: cargo test --no-default-features

      - name: Clippy
        run: cargo clippy --no-default-features --all-targets -- -D warnings
